services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grapeee
      POSTGRES_USER: grapeee
      POSTGRES_PASSWORD: grapeee
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grapeee -d grapeee"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18000
    ports:
      - "13000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
