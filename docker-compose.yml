services:
  postgres:
    image: postgres:16-alpine
    container_name: grapeee-postgres
    environment:
      POSTGRES_DB: grapeee
      POSTGRES_USER: grapeee
      POSTGRES_PASSWORD: grapeee
    ports:
      - "5434:5432"
    volumes:
      - grapeee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grapeee -d grapeee"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: grapeee-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_COMPANION_URL: http://127.0.0.1:8787
      DATABASE_URL: postgres://grapeee:grapeee@postgres:5432/grapeee
      BETTER_AUTH_URL: http://localhost:3001
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-minimax/minimax-m2.5}
    ports:
      - "3001:3000"
    volumes:
      - .:/workspace
    command: ["sh", "-lc", "cd apps/web && ../../node_modules/.bin/next dev --hostname 0.0.0.0 --port 3000"]

volumes:
  grapeee_postgres_data:
